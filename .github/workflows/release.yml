name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      # A tag that disagrees with the TOC ships an addon that reports the wrong
      # version to every addon manager, which is worse than failing the build.
      - name: Check the TOC agrees
        run: |
          TOC_VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' FlightControl/FlightControl.toc | tr -d '\r')
          echo "tag=${{ steps.version.outputs.version }}  toc=$TOC_VERSION"
          if [ "$TOC_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::TOC says $TOC_VERSION but the release is ${{ steps.version.outputs.version }}."
            exit 1
          fi

      # FlightControl/*.lua is generated from dev/ by tools/build.sh. Releasing
      # without having run it would ship whatever was there last time, silently.
      - name: Check the shipping files are up to date with dev/
        run: |
          set -euo pipefail
          for f in FlightControl.lua FlightControlUI.lua; do
            python3 tools/strip-comments.py "dev/$f" > "/tmp/$f"
            if ! diff -q "/tmp/$f" "FlightControl/$f" >/dev/null; then
              echo "::error::FlightControl/$f does not match dev/$f."
              echo "::error::Run tools/build.sh and commit the result."
              diff "FlightControl/$f" "/tmp/$f" | head -40
              exit 1
            fi
          done
          echo "shipping files match dev/"

      # Run the headless suite against the files that are about to ship, not
      # against dev/, so stripping is covered as well as the logic.
      - name: Test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          lua tools/test.lua build

      # Files are listed one by one rather than copying the folder, so nothing
      # can slip into a release by being dropped in the directory later.
      - name: Build the package
        run: |
          set -euo pipefail
          mkdir -p dist/FlightControl
          cp FlightControl/FlightControl.toc   dist/FlightControl/
          cp FlightControl/FlightControl.lua   dist/FlightControl/
          cp FlightControl/FlightControlUI.lua dist/FlightControl/
          cp FlightControl/logo.tga            dist/FlightControl/
          cp LICENSE                           dist/FlightControl/
          cd dist
          zip -r "../FlightControl-${{ steps.version.outputs.version }}.zip" FlightControl

      - name: Show what is in it
        run: unzip -l "FlightControl-${{ steps.version.outputs.version }}.zip"

      # Written to a file rather than a step output: changelog text containing
      # quotes or backticks would otherwise break the shell quoting below.
      - name: Pull this version's changelog entry
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" '
            $0 == v {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            "FlightControl-${VERSION}.zip" \
          || gh release upload "v${VERSION}" "FlightControl-${VERSION}.zip" --clobber

      # Wago's own upload API is a plain multipart POST, so there is no need for
      # the BigWigs packager here -- which also means no .pkgmeta and no guessing
      # at how it would handle the addon living in a subfolder.
      # Skipped cleanly when the token or the project id is absent.
      - name: Upload to Wago Addons
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          WAGO_ID=$(sed -n 's/^## X-Wago-ID:[[:space:]]*//p' FlightControl/FlightControl.toc | tr -d '\r')
          if [ -z "${WAGO_API_TOKEN:-}" ]; then
            echo "::notice::WAGO_API_TOKEN not set — skipping Wago upload."
            exit 0
          fi
          if [ -z "$WAGO_ID" ]; then
            echo "::notice::No '## X-Wago-ID' in the TOC — skipping Wago upload."
            exit 0
          fi

          # Wago wants a patch string like 12.1.0; the TOC carries 120100.
          IFACE=$(sed -n 's/^## Interface:[[:space:]]*//p' FlightControl/FlightControl.toc \
                  | tr -d '\r' | cut -d, -f1 | tr -d '[:space:]')
          PADDED=$(printf '%06d' "$IFACE")
          PATCH="$((10#${PADDED:0:2})).$((10#${PADDED:2:2})).$((10#${PADDED:4:2}))"

          case "$VERSION" in
            *-alpha*) STABILITY=alpha ;;
            *-beta*)  STABILITY=beta ;;
            *)        STABILITY=stable ;;
          esac

          METADATA=$(jq -nc \
            --arg label "$VERSION" \
            --arg stability "$STABILITY" \
            --arg patch "$PATCH" \
            --rawfile changelog release-notes.md \
            '{label: $label, stability: $stability, changelog: $changelog, supported_retail_patch: $patch}')

          echo "Uploading $VERSION to Wago project $WAGO_ID (retail $PATCH, $STABILITY)"

          HTTP=$(curl -sS -w '%{http_code}' -o wago-response.json -X POST \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H "accept: application/json" \
            -F "metadata=$METADATA" \
            -F "file=@FlightControl-${VERSION}.zip" \
            "https://addons.wago.io/api/projects/${WAGO_ID}/version")

          cat wago-response.json; echo
          if [ "$HTTP" -ge 300 ]; then
            echo "::error::Wago upload failed with HTTP $HTTP"
            exit 1
          fi
          echo "Wago upload OK ($HTTP)"
